name: Build Linux64

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build LuaJIT
        run: |
          mkdir -p external/luajit/linux64
          git clone https://github.com/LuaJIT/LuaJIT.git temp_luajit
          cd temp_luajit && make -j$(nproc)
          cp src/libluajit.a ../external/luajit/linux64/

      - name: Install Premake
        run: |
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          sudo cp premake5 /usr/local/bin/

      - name: Build Project
        run: |
          premake5 gmake --gmcommon=external/garrysmod_common
          make -C build config=release_x64
