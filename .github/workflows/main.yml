name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - run: sudo apt update && sudo apt install -y build-essential gcc-multilib g++-multilib libboost-all-dev wget

    - run: |
        wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
        tar -xzf premake-5.0.0-beta2-linux.tar.gz
        sudo mv premake5 /usr/local/bin/

    - name: Patch & Run Premake
      run: |
        sed -i '1s/^/multiprocessorcompile = multiprocessorcompile or function() end\nlinktimeoptimization = linktimeoptimization or function() end\nenablepch = enablepch or function() end\nnopch = nopch or function() end\n/' external/garrysmod_common/premake/generator.lua
        GARRYSMOD_COMMON=$(pwd)/external/garrysmod_common premake5 gmake

    - name: Build Project
      run: GARRYSMOD_COMMON=$(pwd)/external/garrysmod_common make -C projects/linux/gmake

    - uses: actions/upload-artifact@v4
      with:
        name: turbostroi-linux
        path: bin/
