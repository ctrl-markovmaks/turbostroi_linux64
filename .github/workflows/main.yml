name: Build x64
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - run: sudo apt update && sudo apt install -y build-essential gcc-multilib g++-multilib libboost-all-dev wget
    - run: wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz && tar -xzf premake-5.0.0-beta2-linux.tar.gz && sudo mv premake5 /usr/local/bin/
    - run: git submodule update --init --recursive || true
    - run: git clone --recursive https://github.com/danielga/garrysmod_common.git external/garrysmod_common || true
    - run: cd external/garrysmod_common && git submodule update --init --recursive
    - run: test -d external/metamod-source/core || git clone --recursive https://github.com/alliedmodders/metamod-source.git external/metamod-source
    - run: |
        sed -i '1s/^/multiprocessorcompile = multiprocessorcompile or function() end\nlinktimeoptimization = linktimeoptimization or function() end\nenablepch = enablepch or function() end\nnopch = nopch or function() end\n/' external/garrysmod_common/premake/generator.lua
    - run: |
        GARRYSMOD_COMMON=$(pwd)/external/garrysmod_common \
        make -C projects/linux/gmake CXXFLAGS="-I$(pwd)/external/garrysmod_common/sourcesdk/public -I$(pwd)/external/garrysmod_common/include -Wno-deprecated-copy -Wno-error"
    - run: |
        INCS=$(find $(pwd)/external/garrysmod_common -type d \( -name "public" -o -name "include" \) | sed 's/^/-I/')
        GARRYSMOD_COMMON=$(pwd)/external/garrysmod_common make CXXFLAGS="-Wno-deprecated-copy -Wno-error $INCS"
    - uses: actions/upload-artifact@v4
      with:
        name: turbostroi-linux
        path: |
          bin/
          *.so
