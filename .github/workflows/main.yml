name: Build x64
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt update && sudo apt install -y build-essential libboost-all-dev premake5
    - run: premake5 gmake && make -C build
    - uses: actions/upload-artifact@v4
      with:
        name: turbostroi-linux64
        path: bin/
